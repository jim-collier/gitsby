##	Purpose:
##		- The checks that caught what gofmt, vet and staticcheck do not: dropped
##		  errors, shadowed builtins, and Go's own naming convention. Every finding
##		  below was a real one before it became a gate.
##		- Run by cicd.bash stage 1 when installed; the three tools above gate
##		  unconditionally, so a machine without this still cannot land a mess.
##	Notes:
##		- 'default: none' is deliberate. The set is small and argued for; a linter
##		  arriving with a future release should be adopted on purpose, not inherited.
##		- package-comments is off: the file-top prose sits above the copyright block
##		  in every file, which is where it belongs and reads better than a docstring
##		  repeating the package name.
