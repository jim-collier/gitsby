version: "2"

linters:
  default: none
  enable:
    - errcheck      ## a dropped error is how a write becomes a silent no-op
    - errorlint     ## %s on an error kills the chain; %w keeps errors.Is/As honest
    - govet
    - ineffassign   ## a value assigned and never read is a line that means nothing
    - predeclared   ## 'min', 'max', 'len' as names read as the builtin at a glance
    - revive
    - staticcheck
    - unconvert     ## a conversion that converts nothing hides one that does
    - unused
  settings:
    revive:
      rules:
        - name: var-naming        ## URL, ID, SSH - not Url, Id, Ssh
        - name: redefines-builtin-id
        - name: indent-error-flow
        - name: errorf
        - name: error-return
        - name: early-return      ## handle the edge and get out; no else after return
        - name: unreachable-code

formatters:
  enable:
    - gofmt
