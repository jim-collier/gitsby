# Demo scenario for gen-demo-gif.py. This is the machine version; script.txt
# beside it says the same thing in plain language, one scene per [[step]]. Edit
# that one first and keep the two in step.
#
# Each [[step]] types its show= line into the
# fake terminal, runs run= (default: show) for real, and shows the output. {prog}
# renders as the program name; {bin} runs as the tested binary path. pause= is the
# read time in seconds. overflow= is "truncate" (default) or "wrap". scrollrate=
# (px/s) and linems= pace a step's output. cwd= is the folder shown in the prompt.
# end_hold/end_black (seconds) hold the last frame, then show black, before looping.
#
# gitsby is stateful, so a helper builds a throwaway, anonymized world (two repos in
# two folder trees, a local bare "origin", and a gitsby config giving each tree its
# own account) that the commands act on for real - see demo-repo.bash beside this
# file. The arc is one feature start to finish, then the folder rule that decided
# who it all went out as. Step 1's run= builds the world (output hidden); every
# later step re-enters it and sources the env the builder wrote, since each run= is
# its own shell.
#
# Two of the five scenes are about the confirmation, which is the thing the README
# leads with. Step 2 carries ask=/answer=, so it runs with a terminal on its stdin,
# really stops at the question, and has the answer typed on camera. Step 3 types its
# own -y, which is the way past the question and worth seeing once. The rest are
# read-only and need neither.
#
# cwd= is not cosmetic here: the last two scenes are about which folder you are
# standing in, so the prompt has to say. HOME is the demo root, so every cwd= below
# is literally the directory its run= enters.
#
# Every step clears first, which is what keeps the file affordable: a smooth
# scroll redraws the whole text block each frame, so the cost tracks how far the
# view has to travel, and a scrollback that never accumulates halves it.
#
# Keep every commit message and edit fixed: the builder pins the git dates, and
# cicd stamps the demo's build with the newest release rather than the commit, so
# a fixed scenario means identical commit hashes, identical output, identical gif
# bytes - and cicd only rewrites assets/demo.gif when the demo really changed.
# Don't demo a bare `sync` (no message): the auto-generated message is a timestamp,
# which would make the gif differ on every run.

title = "gitsby"
prog  = "gitsby"
seed  = 11
font  = ["Monaspace Argon SemiBold"]
end_hold  = 1.6
end_black = 3.0

# Captions appear whole rather than being typed out. Typing the five of them cost
# 12.9 seconds of a 67.4-second loop - more than the commands they introduce.
type_notes = false

[[step]]
clear = true
cwd   = "~/dev/github.com/acme-corp/acme-api"
note  = "Fetch, then show exactly where you stand"
show  = "{prog} status"
run   = "bash cicd/utility/demo/demo-repo.bash >/dev/null 2>&1 && cd /tmp/gitsby-demo/dev/github.com/acme-corp/acme-api && source /tmp/gitsby-demo/demo.env && {bin} status"
pause = 2.6

[[step]]
clear  = true
cwd    = "~/dev/github.com/acme-corp/acme-api"
note   = "New branch. It shows the git first, and asks"
show   = "{prog} br create add-retries"
run    = "cd /tmp/gitsby-demo/dev/github.com/acme-corp/acme-api && source /tmp/gitsby-demo/demo.env && {bin} br create add-retries"
ask    = "Continue? (y|n): "
answer = "y"
pause  = 3.2

[[step]]
clear = true
cwd   = "~/dev/github.com/acme-corp/acme-api"
note  = "Commit, pull and push. -y answers the question"
show  = "{prog} sync \"Retry failed API calls\" -y"
run   = "cd /tmp/gitsby-demo/dev/github.com/acme-corp/acme-api && source /tmp/gitsby-demo/demo.env && {bin} sync \"Retry failed API calls\" -y"
pause = 3.2

[[step]]
clear = true
cwd   = "~/dev/github.com/acme-corp/acme-api"
note  = "That went out as mika-at-acme. Here is why"
show  = "{prog} account"
run   = "cd /tmp/gitsby-demo/dev/github.com/acme-corp/acme-api && source /tmp/gitsby-demo/demo.env && {bin} account"
pause = 2.8

[[step]]
clear = true
cwd   = "~/code/github.com/mika-rivers/dotfiles"
note  = "Another tree, another root - another account"
show  = "{prog} account"
run   = "cd /tmp/gitsby-demo/code/github.com/mika-rivers/dotfiles && source /tmp/gitsby-demo/demo.env && {bin} account"
pause = 3.2
